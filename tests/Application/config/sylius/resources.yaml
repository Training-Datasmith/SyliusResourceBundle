sylius_resource:
    mapping:
        imports:
            - '%kernel.project_dir%/config/sylius/resources/imports'
        paths:
            - '%kernel.project_dir%/src/BoardGameBlog/Infrastructure/Sylius/Resource'
            - '%kernel.project_dir%/src/Subscription/Entity'

    translation:
        locale_provider: test.translation_locale_provider

    resources:
        app.blog_post:
            classes:
                model: App\Entity\Blog_Post
                form: App\Form\Type\Blog_Post_Type

        app.book:
            classes:
                model: App\Entity\Book
                factory: App\Factory\Book_Factory
                controller: App\Controller\Book_Controller
                repository: App\Repository\Book_Repository
                form: App\Form\Type\Book_Type
            translation:
                classes:
                    model: App\Entity\Book_Translation
                    interface: App\Entity\Book_Translation_Interface
                    form: App\Form\Type\Book_Translation_Type

        app.comic_book:
            classes:
                model: App\Entity\Comic_Book

        app.legacy_book:
            classes:
                model: App\Entity\Legacy_Book
                factory: App\Factory\Legacy_Book_Factory
            translation:
                classes:
                    model: App\Entity\Legacy_Book_Translation

        app.science_book:
            classes:
                model: App\Entity\Science_Book
                form: App\Form\Type\Science_Book_Type

        app.gedmo:
            classes:
                model: App\Entity\Gedmo_Extended_Example

        app.pull_request:
            classes:
                model: App\Entity\Pull_Request
                form: App\Form\Type\Pull_Request_Type

        app.speaker:
            classes:
                model: App\Conference\Entity\Speaker

        app.zone:
            classes:
                model: App\Entity\Zone\Zone
                interface: App\Entity\Zone\Zone_Interface

        app.zone_member:
            classes:
                model: App\Entity\Zone\Zone_Member
                interface: App\Entity\Zone\Zone_Member_Interface
